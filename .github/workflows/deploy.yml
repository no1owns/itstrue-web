name: Deploy to GitHub Pages

# Builds the site with the official Astro action and publishes it to GitHub
# Pages on every push to main. Requires Settings → Pages → Source:
# "GitHub Actions". See docs/deployment.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the Pages configuration. On the project URL this gives
      # origin=https://<owner>.github.io and base_path=/<repo>; once a custom
      # domain is set in Settings → Pages it gives that domain and an empty
      # base path. No repository name or domain is hardcoded.
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Set site URL and base path
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "SITE_URL=$ORIGIN" >> "$GITHUB_ENV"
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"

      - name: Build and upload site
        uses: withastro/action@v6
        env:
          # Repository variables (Settings → Secrets and variables → Actions →
          # Variables). SITE_LIVE stays false until launch: pages are noindex
          # and placeholders show with labels.
          SITE_LIVE: ${{ vars.SITE_LIVE || 'false' }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

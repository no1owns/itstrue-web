name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Build under the same kind of base path GitHub Pages uses, so a link
      # that forgets the base path fails the link check.
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium for the accessibility scan
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Asset inventory is up to date
        run: npm run inventory:check

      - name: Build
        run: npm run build

      - name: Internal links
        run: npm run check:links

      - name: Accessibility (axe, WCAG 2.2 AA)
        run: npm run check:a11y
